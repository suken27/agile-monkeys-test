services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: releasepilot
      POSTGRES_USER: releasepilot
      POSTGRES_PASSWORD: releasepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasepilot -d releasepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: releasepilot
      RABBITMQ_DEFAULT_PASS: releasepilot
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/suken27/agile-monkeys-test:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/releasepilot
      SPRING_DATASOURCE_USERNAME: releasepilot
      SPRING_DATASOURCE_PASSWORD: releasepilot
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: releasepilot
      SPRING_RABBITMQ_PASSWORD: releasepilot
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  rabbitmq-data:
